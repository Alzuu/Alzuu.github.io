<!DOCTYPE html>
<html id="html" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="PaperBox es una página para crear reseñas y compartir experiencias lectoras">
  <title>PaperBox</title>
  <link href="/assets/logo.svg" rel="icon">
  <link href="/css/estilo.css" rel="stylesheet">
</head>
<body>
  <header>
    <section>
      <h1>
        <img src="/assets/logo.svg" height=60>
        <a href="/index.html">PaperBox</a>
      </h1>
    </section>
  </header>
  <main>
    <h2>Registrate</h2>
    <p>
      <form>
        <table>
          <tbody>
            <tr>
              <td>
                <label for="usuario">Nombre de Usuario</label>
              </td>
              <td>
                <input id="usuario" type="text" name="usuario" value required>
              </td>
            </tr>
            <tr>
              <td>
                <label for="email">Email</label>
              </td>
              <td>
                <input id="email" type="text" name="email" value required>
              </td>
            </tr>
            <tr>
              <td>
                <label for="password">Contraseña</label>
              </td>
              <td>
                <input id="password" type="password" name="password" required>
              </td>
            </tr>
            <tr>
              <td></td>
              <td>
                <input type="checkbox" name="terminos" required>
                Estoy de acuerdo con los
                <a href="pages/terminos-y-condiciones.html">Terminos y Condiciones</a>
                .
              </td>
            </tr>
            <tr>
              <td></td>
              <td>
                <button class="boton">Crear Usuario</button>
              </td>
            </tr>
          </tbody>
        </table>
      </form>
  </main>
  <footer>
    <ul>
      <li>
        <a href="https://www.instagram.com/paperbox"><i>instagram</i></a>
      </li>
      <li>
        <a href="https://es.wikipedia.org/wiki/twitter"><i>twitter</i></a>
      </li>
      <li>
        <a href="https://www.discord.com"><i>discord</i></a>
      </li>
    </ul>
    <a href="/pages/terminos-y-condiciones.html">Términos y condiciones</a>
    <a href="/pages/preguntas-frecuentes.html">Preguntas frecuentes</a>
    <a href="/pages/ayuda.html">Ayuda</a>
    <a href="/pages/nosotros.html">Nosotros</a>
    PaperBox 2026
  </footer>
</body>
